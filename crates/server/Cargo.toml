[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rusty-hook"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "derive"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "request-id", "set-header", "timeout", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
sha2 = "0.11.1"
subtle = "2.6.1"
getrandom = { version = "0.4.3", features = ["std"] }
base64 = "0.23.1"
mimalloc = { version = "0.1", default-features = false }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
governor = "0.10.4"

[lints]
workspace = true
