[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared.workspace = true
serde.workspace = true
# Exact numbers and key order matter when inspecting payloads.
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
uuid.workspace = true
leptos = { version = "0.8.22", features = ["csr"] }
# Must match the wasm-bindgen-cli version in the Dockerfile.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Window", "Location", "Navigator", "Clipboard", "Document",
    "EventSource", "MessageEvent", "Event",
    "Request", "RequestInit", "RequestCredentials", "Response", "Headers",
    "KeyboardEvent", "Element", "History",
] }
console_error_panic_hook = "0.1.7"

[lints]
workspace = true
